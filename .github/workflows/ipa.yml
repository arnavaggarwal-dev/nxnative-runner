# IPA of one game (default Breath of the Wild) from the NSPs in a release (upload-inputs.ps1), built with seedds/nxnative.
# The IPA lands in release ipa-<run id> as ~1.9 GB parts (get-ipa.ps1 joins them). probe = only check the runner and tools.
# The same file runs in the public runner repo (free macOS minutes): its STORAGE_TOKEN secret reaches the private repo,
# which keeps every game file, the IPA and the logs; only this file and the run's console output are public.
name: ipa
on:
  workflow_dispatch:
    inputs:
      probe:
        description: only check the runner (disk, CPU, Xcode, tools), no game files
        type: boolean
        default: false
      nxnative:
        description: seedds/nxnative commit
        default: d0b7c846ba6cf5107f5376342418b9af954dacc7
      game:
        description: base game title ID (its nxnative profile)
        default: 01007EF00011E000
      release:
        description: release holding the game's NSP parts
        default: inputs

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.STORAGE_TOKEN || github.token }}
  GH_REPO: arnavaggarwal-dev/nxnative-build
  DM_GAME: ${{ inputs.game }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Runner
        run: |
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          xcode-select -p; xcodebuild -version; ls /Applications | grep -i xcode
          ls -la "/System/Library/Fonts/Supplemental/Arial Unicode.ttf"
          df -h /

      - name: Free disk (other Xcodes, Android SDK)
        run: |
          keep=$(xcode-select -p | sed 's|/Contents/Developer||')
          for x in /Applications/Xcode*.app; do
            [ -L "$x" ] || [ "$x" = "$keep" ] || sudo rm -rf "$x" &
          done
          sudo rm -rf "${ANDROID_HOME:-/nonexistent}" ~/Library/Android &
          wait
          df -h /

      - uses: actions/checkout@v4

      - name: Tools
        run: |
          brew install xcodegen zstd glslang
          brew install --cask dotnet-sdk
          python3 -m pip install --break-system-packages lz4 capstone fonttools "backports.zstd; python_version < '3.14'"
          python3 -c 'import lz4.block, capstone, fontTools; print("python ok")'
          dotnet --list-sdks
          git init -q nx
          git -C nx fetch -q --depth 1 https://github.com/seedds/nxnative.git ${{ inputs.nxnative }}
          git -C nx checkout -q FETCH_HEAD
          dotnet build nx/dm/tools/nx_extract -c Release -o "$RUNNER_TEMP/nx_extract" -v quiet -nologo
          # since b3d9b24 the NSP script builds the iOS shaders with this runner's own Metal compiler; spirv-cross is in the repo
          # (dm/gfx/tools/own_compilers.py): no re-lock of dmsh_chain.lock (an older nxnative commit needs one)
          xcrun -sdk iphoneos metal --version | head -1

      - name: Download NSPs
        if: ${{ !inputs.probe }}
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          printf '%s' "$PROD_KEYS" > "$RUNNER_TEMP/prod.keys"
          [ -s "$RUNNER_TEMP/prod.keys" ] || { echo "::error::secret PROD_KEYS is not set"; exit 1; }
          mkdir -p nsp parts
          gh release download "${{ inputs.release }}" -p files.tsv -D parts
          while IFS=$'\t' read -r id name size; do
            gh release download "${{ inputs.release }}" -p "$id.part*" -D parts
            cat parts/$id.part* > "nsp/$name" && rm parts/$id.part*
            [ "$(stat -f %z "nsp/$name")" = "$size" ] || { echo "size mismatch: $name"; exit 1; }
          done < parts/files.tsv
          ls -la nsp; df -h /

      - name: Build IPA
        if: ${{ !inputs.probe }}
        timeout-minutes: 330
        # the IPA lands in nsp/ under the profile's name (a game without a profile: a provisional profile and a best-effort IPA)
        run: python3 nx/scripts/build_ipa_from_nsp.py nsp -k "$RUNNER_TEMP/prod.keys" --env-file handheld.txt --no-keep-extracted --progress lines

      # ipa.sha256 also carries the IPA's file name, which get-ipa.ps1 restores
      - name: Upload IPA
        if: ${{ !inputs.probe }}
        run: |
          rm -f nsp/*.nsp
          cd nsp
          ipa=$(ls *.ipa)
          shasum -a 256 "$ipa" | tee ipa.sha256
          split -b 1900m -a 2 "$ipa" ipa.part && rm "$ipa"
          gh release create "ipa-$GITHUB_RUN_ID" ipa.sha256 ipa.part* --title "${ipa%.ipa} IPA (run $GITHUB_RUN_ID)" --notes "$DM_GAME, nxnative ${{ inputs.nxnative }}, handheld (DM_OPMODE=0)"

      # to the private repo's release "logs", not an artifact: a public repo's artifacts are public
      - name: Logs
        if: ${{ always() && !inputs.probe }}
        run: |
          # the logs, and for a game without a profile its survey and provisional profile
          f=$(cd nsp && ls -d "${DM_GAME}_build/logs" "${DM_GAME}_build/profile" "${DM_GAME}_survey" 2> /dev/null) || true
          [ -n "$f" ] || exit 0
          tar -C nsp -czf "logs-$GITHUB_RUN_ID.tgz" $f
          gh release view logs > /dev/null 2>&1 || gh release create logs --title logs --notes 'build logs (logs-<run id>.tgz)'
          gh release upload logs "logs-$GITHUB_RUN_ID.tgz" --clobber
